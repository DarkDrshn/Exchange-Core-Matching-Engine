name: exchange-core-ci

on:
  push:
    branches: ["main", "phase/**"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [debug, release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake --preset ${{ matrix.build_type }}

      - name: Build project
        run: cmake --build build/${{ matrix.build_type }} --parallel

      - name: Run tests
        run: ctest --test-dir build/${{ matrix.build_type }} --output-on-failure

      - name: Smoke benchmark
        if: matrix.build_type == 'release'
        run: ./build/${{ matrix.build_type }}/exchange_core_bench 1000

      - name: Check diff hygiene
        run: git diff --check
